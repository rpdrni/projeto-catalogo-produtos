<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <style>
        /* Reset e Variáveis Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-principal: #f8fafc;
            --bg-card: #ffffff;
            --texto-principal: #1e293b;
            --texto-secundario: #64748b;
            --primary: #4f46e5; /* Roxo/Azul moderno */
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --borda: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            line-height: 1.5;
        }

        /* Navbar Moderna */
        nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--borda);
            padding: 16px 40px;
        }

        nav a {
            color: var(--texto-principal);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Layout Container Centralizado */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--borda);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .card-header {
            background-color: #f8fafc;
            padding: 24px 32px;
            border-bottom: 1px solid var(--borda);
        }

        .card-header h2 {
            color: var(--texto-principal);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .card-body {
            padding: 32px 32px;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--texto-principal);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--borda);
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--texto-principal);
            transition: all 0.2s;
            outline: none;
            background-color: #f8fafc;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background-color: #fff;
        }

        /* Alerta de Erro Moderno */
        .error-message {
            background-color: var(--danger-bg);
            color: #991b1b;
            border-left: 4px solid var(--danger);
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            animation: shake 0.2s ease-in-out 2;
        }

        /* Ações e Botões */
        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 28px;
        }

        button[type="submit"] {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 11px 24px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        .form-actions a {
            color: var(--texto-secundario);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .form-actions a:hover {
            color: var(--danger);
        }

        /* Animação subtil para erro de login */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

<nav>
    <div>
        <a href="/produtos">FATEC │ CATALOGO</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Acesso ao Sistema</h2>
        </div>
        <div class="card-body">

            <div th:if="${param.error}" class="error-message">
                Utilizador ou senha inválidos.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Utilizador</label>
                    <input type="text" id="username" name="username" placeholder="Ex: Aluno" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="form-actions">
                    <a href="/produtos">Cancelar</a>
                    <button type="submit">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
