<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Categorias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Reset e Variáveis Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-principal: #f8fafc;
            --bg-card: #ffffff;
            --texto-principal: #1e293b;
            --texto-secundario: #64748b;
            --primary: #4f46e5; /* Roxo/Azul moderno */
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --borda: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            line-height: 1.5;
        }

        /* Navbar Moderna */
        nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--borda);
            padding: 16px 40px;
        }

        nav .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        nav a.logo {
            color: var(--texto-principal);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        nav .btn-entrar {
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        nav .btn-entrar:hover {
            background-color: var(--primary-hover);
        }

        /* Layout Container centralizado e mais estreito para Categorias */
        .main-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--texto-principal);
            letter-spacing: -0.5px;
        }

        .add {
            display: inline-flex;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            transition: background-color 0.2s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .add:hover {
            background-color: var(--primary-hover);
        }

        /* Botões de Ação na Tabela */
        .btn-editar, .btn-remover {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-editar {
            background-color: #f1f5f9;
            color: #334155;
            margin-right: 6px;
        }

        .btn-editar:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .btn-remover {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .btn-remover:hover {
            background-color: #fee2e2;
        }

        /* Tabela Estilo Card Clean */
        .table-container {
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--borda);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--borda);
        }

        thead th {
            padding: 14px 24px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--texto-secundario);
        }

        tbody tr {
            border-bottom: 1px solid var(--borda);
            transition: background-color 0.2s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        tbody td {
            padding: 16px 24px;
            font-size: 0.9rem;
            color: var(--texto-principal);
        }

        /* Link de Voltar Tratado como Botão Discreto */
        .back-link-container {
            text-align: center;
            margin-top: 24px;
        }

        .back-link {
            color: var(--texto-secundario);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="/produtos" class="logo">FATEC │ CATALOGO</a>
        <div>
            <a th:href="@{/login}" class="btn-entrar" sec:authorize="isAnonymous()">Entrar</a>
            <form th:action="@{/logout}" method="post" style="display: inline;" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn-remover" style="padding: 8px 16px; font-weight: 600;">
                    Sair
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="main-container">

    <div class="header-section">
        <h1>Lista de Categorias</h1>
        <div class="admin-actions">
            <a class="add" href="/categorias/novo">Adicionar Categoria</a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th style="width: 15%;">ID</th>
                <th>Nome</th>
                <th style="width: 25%;">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categorias}">
                <td style="color: var(--texto-secundario); font-weight: 500;" th:text="${cat.idCategoria}"></td>
                <td style="font-weight: 500;" th:text="${cat.nome}"></td>
                <td>
                    <a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}" class="btn-editar">Editar</a>
                    <a th:href="@{/categorias/excluir/{id}(id=${cat.idCategoria})}"
                       class="btn-remover" onclick="return confirm('Deseja realmente excluir esta categoria?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="back-link-container">
        <a href="/produtos" class="back-link">← Voltar ao Catálogo</a>
    </div>
</div>

</body>
</html>
