<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Auditoria - Catálogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-principal: #f8fafc;
            --bg-card: #ffffff;
            --texto-principal: #1e293b;
            --texto-secundario: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --borda: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            line-height: 1.5;
        }

        nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--borda);
            padding: 16px 40px;
        }

        nav .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav a.logo {
            color: var(--texto-principal);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn-remover {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .btn-remover:hover {
            background-color: #fee2e2;
        }

        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--texto-principal);
            letter-spacing: -0.5px;
        }

        .admin-actions {
            display: flex;
            gap: 12px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            background-color: #e2e8f0;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .btn-voltar:hover {
            background-color: #cbd5e1;
            color: #0f172a;
        }

        .table-container {
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--borda);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--borda);
        }

        thead th {
            padding: 14px 24px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--texto-secundario);
        }

        tbody tr {
            border-bottom: 1px solid var(--borda);
            transition: background-color 0.2s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        tbody td {
            padding: 16px 24px;
            font-size: 0.9rem;
            color: var(--texto-principal);
        }

        /* Estilização das Badges de Operação */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-create {
            background-color: var(--success-bg);
            color: #065f46;
        }

        .badge-update {
            background-color: var(--warning-bg);
            color: #92400e;
        }

        .badge-delete {
            background-color: var(--danger-bg);
            color: #991b1b;
        }

        .usuario-tag {
            font-weight: 600;
            color: #475569;
            background-color: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="/produtos" class="logo">FATEC │ AUDITORIA</a>
        <div>
            <form th:action="@{/logout}" method="post" style="display: inline;" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn-remover" style="padding: 8px 16px; font-weight: 600;">
                    Sair
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="main-container">

    <div class="header-section">
        <h1>Painel de Auditoria de Produtos</h1>
        <div class="admin-actions">
            <a class="btn-voltar" href="/produtos">← Voltar para Produtos</a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID Log</th>
                <th>Operação</th>
                <th>ID Produto</th>
                <th>Produto Alterado</th>
                <th>Data e Hora</th>
                <th>Usuário Responsável</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="6" style="text-align: center; color: var(--texto-secundario); padding: 32px;">
                    Nenhum registro de auditoria encontrado.
                </td>
            </tr>

            <tr th:each="log : ${logs}">
                <td style="color: var(--texto-secundario); font-weight: 500;" th:text="${log.idAuditoria}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${log.operacao == 'CREATE' ? 'badge-create' : (log.operacao == 'UPDATE' ? 'badge-update' : 'badge-delete')}"
                          th:text="${log.operacao}">
                    </span>
                </td>
                <td th:text="${log.produtoId}"></td>
                <td style="font-weight: 500;" th:text="${log.produtoNome}"></td>
                <td style="color: var(--texto-secundario);" th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td>
                    <span class="usuario-tag" th:text="${log.usuarioResponsavel}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
